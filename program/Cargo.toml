[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# デプロイ費用（保証金）はプログラムのサイズに比例するので、サイズ優先で最適化する
opt-level = "z"
panic = "abort"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
